name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify course content with rustc
        run: |
          rustup default stable
          python3 tools/verify_course.py

      - name: Unit, UI and screenshot tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rustle-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
