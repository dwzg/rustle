name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust for Android
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Rust core tests and lints
        working-directory: core
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Verify course content with rustc
        run: cargo run --release --manifest-path core/Cargo.toml --bin verify-course

      - name: Unit, UI and screenshot tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rustle-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
