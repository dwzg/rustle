[package]
name = "rustle-core"
version = "0.1.0"
edition = "2024"
description = "Course parsing, grading and progress rules for the Rustle app"
publish = false

[lib]
name = "rustle_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "verify-course"
path = "src/bin/verify-course.rs"

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
